name: Temporary UI Formatting Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Show canonical formatting
        run: |
          npx prettier --write src/pages/welcome/WelcomePage.tsx src/shells/PublicShell/PublicShell.tsx
          git diff -- src/pages/welcome/WelcomePage.tsx src/shells/PublicShell/PublicShell.tsx
