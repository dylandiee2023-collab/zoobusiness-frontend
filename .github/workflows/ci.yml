name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        run: npm run build

      - name: Capture formatted source snapshot (temporary)
        run: |
          npx prettier --write docs/frontend-foundation.md src/app/router/routes.tsx src/components/layout/sidebar/context/sidebar-provider.tsx src/dashboard/navigation/navigation.types.ts src/design-system/components/button/Button.types.ts src/design-system/components/button/index.ts src/index.css src/layouts/dashboard/dashboard-layout.css src/pages/dashboard/DashboardPage.css src/pages/dashboard/DashboardPage.tsx
          for file in "docs/frontend-foundation.md" "src/app/router/routes.tsx" "src/components/layout/sidebar/context/sidebar-provider.tsx" "src/dashboard/navigation/navigation.types.ts" "src/design-system/components/button/Button.types.ts" "src/design-system/components/button/index.ts" "src/index.css" "src/layouts/dashboard/dashboard-layout.css" "src/pages/dashboard/DashboardPage.css" "src/pages/dashboard/DashboardPage.tsx"; do
            printf '\n<<<FORMAT_FILE_START:%s>>>\n' "$file"
            cat "$file"
            printf '\n<<<FORMAT_FILE_END:%s>>>\n' "$file"
          done

      - name: Prettier check
        run: npm run format:check
